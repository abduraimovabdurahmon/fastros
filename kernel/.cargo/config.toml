# Only applies when cargo runs from kernel/ — the kernel is the one crate built
# for bare metal; the libraries under lib/ are tested on the host.
[build]
target = "x86_64-unknown-none"

# smoltcp sizes its interface tables at compile time (build.rs reads these).
# The default of 2 addresses is too few: we carry IPv4 loopback + a DHCP/static
# IPv4 address + IPv6 loopback (::1) + a ULA + a link-local. Raise the caps so
# every address is actually assigned (extra pushes are otherwise dropped).
[env]
SMOLTCP_IFACE_MAX_ADDR_COUNT = "8"
SMOLTCP_IFACE_MAX_ROUTE_COUNT = "4"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "force-frame-pointers=yes",
    # The kernel never touches SSE/AVX state (user programs own it), so every
    # crypto crate must use its portable implementation.
    "--cfg", "chacha20_force_soft",
    "--cfg", "aes_force_soft",
    "--cfg", "poly1305_force_soft",
    "--cfg", "polyval_force_soft",
    "--cfg", 'curve25519_dalek_backend="serial"',
]
