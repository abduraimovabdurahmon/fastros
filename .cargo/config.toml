[build]
target = "x86_64-unknown-none"

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "link-arg=-no-pie",
    "-C", "link-arg=-static",
    "-C", "link-arg=-n",
    "-C", "link-arg=-Tlinker.ld",
]
