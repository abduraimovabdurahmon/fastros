[package]
name = "fastros"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fastros"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2

[dependencies]
ed25519-dalek    = { version = "1.0.1", default-features = false, features = ["u64_backend"] }
curve25519-dalek = { version = "3.2.1", default-features = false, features = ["u64_backend"] }
sha2             = { version = "0.10",  default-features = false }
hmac             = { version = "0.12",  default-features = false }
aes-soft         = { version = "0.6",   default-features = false }
cipher-02        = { package = "cipher", version = "0.2", default-features = false }
