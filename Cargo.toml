[workspace]
resolver = "2"
members = ["kernel", "lib/*"]
# `cargo test` from the repo root runs the host-testable libraries only;
# the kernel is built from kernel/ (its .cargo/config.toml selects the
# bare-metal target).
default-members = ["lib/*"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
debug = 1
# Integer overflow is a bug, not a wrap-around: trap on it in every build.
overflow-checks = true
codegen-units = 16
